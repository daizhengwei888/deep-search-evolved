<title id="figure-title">Deep Search 5.0.1 与 4.0.0 的五项离线盲评手绘折线图</title>
<desc id="figure-description">白纸、铅笔、钢笔风格的真实矢量图。五类任务从左往右依次是研究规划、简单事实、口径冲突、引用支持、无工具回答。旧版评分分别为5、7、6、6.5、7.5分，新版每项为9分。总计每题两轮、十次有效对照，新版十胜。旧版均分6.40，新版均分9.00，增加2.60分。纵轴是0至10分，横轴为离散研究任务类别，不是时间趋势。项目自测而非独立认证。</desc>
